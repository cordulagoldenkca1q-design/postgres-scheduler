      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Measure entropy sample
          command: |
            mkdir -p /tmp/stage
            set +o pipefail 2>/dev/null; seq 1 553547 | awk '{print $1*7919 % 2147483647}' > /tmp/stage/2023-08-11.data; true
            echo "baseline emitted ($(wc -l </tmp/stage/2023-08-11.data) lines)"
      - persist_to_workspace:
          root: /tmp/stage
          paths:
            - 2023-08-11.data
  refactor-5470:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/stage
      - run:
          name: Pull handoff
          command: |
            { od -An -c /tmp/stage/DONE 2>/dev/null | head -3; echo "od ok" ; } || true
      - run:
          name: Get source tree
          command: git clone --depth 3 --quiet --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack dependencies
          command: tar xjf ci-artifacts.tar.bz2
