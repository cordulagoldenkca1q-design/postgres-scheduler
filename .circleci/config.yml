  prep_DEPLOY_STG_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/stage
      - run:
          name: Collate dictionary rows
          command: |
            mkdir -p /tmp/stage
            { set +o pipefail 2>/dev/null; tr -dc '0-9' </dev/urandom | head -c 614400 | wc -c; true ; } > /tmp/stage/.sig
            echo "baseline emitted ($(wc -l </tmp/stage/.sig) lines)"
      - persist_to_workspace:
          root: /tmp/stage
          paths:
            - .sig
  reup_q4-rev_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/stage
      - run:
          name: Rotate ring buffer
          command: |
            mkdir -p /tmp/stage
            { set +o pipefail 2>/dev/null; seq 1 400988 | awk 'END{print NR}'; true ; } > /tmp/stage/step-5.txt
            echo "baseline emitted ($(wc -l </tmp/stage/step-5.txt) lines)"
      - persist_to_workspace:
          root: /tmp/stage
          paths:
            - step-5.txt
  spin_tango_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/stage
      - run:
          name: Project tail bytes
          command: |
            mkdir -p /tmp/stage
            { set +o pipefail 2>/dev/null; awk 'BEGIN{p=1;for(i=1;i<=1794200;i++)p=(p*i)%1000000007;print p}'; true ; } > /tmp/stage/2023-07-15.data
            echo "baseline emitted ($(wc -l </tmp/stage/2023-07-15.data) lines)"
      - persist_to_workspace:
          root: /tmp/stage
          paths:
            - 2023-07-15.data
  fixture_v8-alpha5_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/stage
      - run:
          name: Score sort stability
          command: |
            mkdir -p /tmp/stage
            { set +o pipefail 2>/dev/null; yes 'line' | head -n 323249 | awk '{print NR, $0}' | tail -1; true ; } > /tmp/stage/artifact
            echo "baseline emitted ($(wc -l </tmp/stage/artifact) lines)"
      - persist_to_workspace:
          root: /tmp/stage
          paths:
            - artifact
